<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do It Now</title>
  </head>
  <body class="bg-paper w-full selection:bg-accent selection:text-card">
    <div class="max-w-5xl w-full h-svh mx-auto flex items-end justify-center">
      <!-- info box -->
      <section class="w-70 self-start mt-[11svh] flex flex-col mr-16">
        <div class="flex-3">
          <h1 class="font-display font-extrabold text-[40px] text-ink">Today</h1>
          <p id="date" class="font-sans font-normal text-[14px] text-muted -mt-1.5">Monday, November 9</p>

          <!-- progress bar -->
          <div class="w-full bg-chip rounded-full h-1.5 mt-6 overflow-hidden">
            <div
              id="progress"
              class="bg-btn h-1.5 rounded-full"
              style="width: 0%; transition: width 400ms var(--ease-bounce)"
            ></div>
          </div>

          <p class="font-sans font-normal text-[14px] text-muted mt-2">
            <span id="completed-todo-count">0</span> of <span id="total-todo-count">4</span> done
          </p>
        </div>


        <!-- date cardss -->
        <div id="days" class="flex-2 w-full mt-4 flex justify-between pt-1  gap-1.5 scrollbar-none overflow-auto overflow-y-visible"></div>
      </section>

      <!-- main todo sectn --> 
      <main class="relative w-130 h-8/9 flex flex-col justify-between">
        <div id="todo-container" class="w-130 flex-1 overflow-y-auto overflow-x-hidden">
          <div
            class="todo-row animate-enter w-full h-13 rounded-xl bg-card flex items-center mb-2.5 cursor-pointer"
            aria-checked="false"
            tabindex="0"
          >
            <div class="relative w-6 h-6 border-muted rounded-md border-[1.5px] mx-4 shrink-0 checkbox">
              <svg class="absolute w-8 h-8 -top-2 -left-1 text-ok overflow-visible" viewBox="0 0 32 32" fill="none">
                <path
                  class="check-path"
                  d="M4 16L12 24L28 5"
                  pathLength="100"
                  stroke="currentColor"
                  stroke-width="5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <p class="task-text font-sans -ml-1 text-[15px] font-normal text-ink">Stretch for 5 mins</p>
          </div>
          <div
            class="todo-row animate-enter w-full h-13 rounded-xl bg-card flex items-center mb-2.5 cursor-pointer"
            aria-checked="false"
            tabindex="0"
          >
            <div class="relative w-6 h-6 border-muted rounded-md border-[1.5px] mx-4 shrink-0 checkbox">
              <svg class="absolute w-8 h-8 -top-2 -left-1 text-ok overflow-visible" viewBox="0 0 32 32" fill="none">
                <path
                  class="check-path"
                  d="M4 16L12 24L28 5"
                  pathLength="100"
                  stroke="currentColor"
                  stroke-width="5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <p class="task-text font-sans -ml-1 text-[15px] font-normal text-ink">5 Pushups</p>
          </div>
          <div
            class="todo-row animate-enter w-full h-13 rounded-xl bg-card flex items-center mb-2.5 cursor-pointer"
            aria-checked="false"
            tabindex="0"
          >
            <div class="relative w-6 h-6 border-muted rounded-md border-[1.5px] mx-4 shrink-0 checkbox">
              <svg class="absolute w-8 h-8 -top-2 -left-1 text-ok overflow-visible" viewBox="0 0 32 32" fill="none">
                <path
                  class="check-path"
                  d="M4 16L12 24L28 5"
                  pathLength="100"
                  stroke="currentColor"
                  stroke-width="5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <p class="task-text font-sans -ml-1 text-[15px] font-normal text-ink">Pullups</p>
          </div>

          <div
            class="todo-row animate-enter w-full h-13 rounded-xl bg-card flex items-center mb-2.5 cursor-pointer"
            aria-checked="false"
            tabindex="0"
          >
            <div class="relative w-6 h-6 border-muted rounded-md border-[1.5px] mx-4 shrink-0 checkbox">
              <svg class="absolute w-8 h-8 -top-2 -left-1 text-ok overflow-visible" viewBox="0 0 32 32" fill="none">
                <path
                  class="check-path"
                  d="M4 16L12 24L28 5"
                  pathLength="100"
                  stroke="currentColor"
                  stroke-width="5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <p class="task-text font-sans -ml-1 text-[15px] font-normal text-ink">Clean Bedroom</p>
          </div>
        </div>

        <!-- add tasks section -->
        <section class="w-130 h-25 flex pb-5 items-center">
          <input
            id="input"
            type="text"
            placeholder="Write a task..."
            class="focus:outline-accent flex-1 rounded-[10px] bg-card p-3 pl-4 h-13 font-sans tracking-wide font-medium text-ink"
          />
          <button
            id="button"
            class="h-13 w-22 font-medium bg-btn rounded-[10px] ml-2 text-card font-sans cursor-pointer"
          >
            Add
          </button>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/date.js"></script>
  </body>
</html>
